<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="display">
                <div class="expression" id="expression"></div>
                <div class="result" id="result">0</div>
            </div>
            
            <div class="buttons">
                <button class="btn action" data-action="clear">C</button>
                <button class="btn action" data-action="clearEntry">CE</button>
                <button class="btn action" data-action="backspace">&#9003;</button>
                <button class="btn operator" data-value="÷">÷</button>
                
                <button class="btn bonus" data-action="square">X²</button>
                <button class="btn bonus" data-action="percent">%</button>
                <button class="btn bonus" data-action="toggleSign">±</button>
                <button class="btn operator" data-value="x">x</button>
                
                <button class="btn number" data-value="7">7</button>
                <button class="btn number" data-value="8">8</button>
                <button class="btn number" data-value="9">9</button>
                <button class="btn operator" data-value="-">-</button>
                
                <button class="btn number" data-value="4">4</button>
                <button class="btn number" data-value="5">5</button>
                <button class="btn number" data-value="6">6</button>
                <button class="btn operator" data-value="+">+</button>
                
                <button class="btn number" data-value="1">1</button>
                <button class="btn number" data-value="2">2</button>
                <button class="btn number" data-value="3">3</button>
                <button class="btn equals" data-action="compute">=</button>
                
                <button class="btn number zero" data-value="0">0</button>
                <button class="btn number" data-value=".">.</button>
                <button class="btn integral">∫</button>
            </div>
        </div>
        
        <div class="history-panel">
            <div class="history-header">
                <h2>Historique</h2>
                <button class="btn-clear-history" data-action="clearHistory">Clear History</button>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
